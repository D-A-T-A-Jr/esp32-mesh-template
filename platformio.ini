[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

extra_scripts =
  pre:scripts/load_env.py

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager@^2.0.17
  https://github.com/jonatasperaza/painlessMesh-fixed.git

build_flags =
  -D MQTT_MAX_PACKET_SIZE=4096

; Placa ESP8266 (ex.: LOLIN/Wemos D1 mini). mesh_node_core.cpp ja trata as
; diferencas de plataforma (SHA-256 via BearSSL em vez de mbedtls, polaridade
; do LED onboard). painlessMesh-fixed suporta os dois chips nativamente.
[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
upload_speed = 921600

extra_scripts =
  pre:scripts/load_env.py

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager@^2.0.17
  https://github.com/jonatasperaza/painlessMesh-fixed.git

build_flags =
  -D MQTT_MAX_PACKET_SIZE=4096

; Mesmo firmware do [env:esp32], com prints extras de diagnostico (status
; WiFi/RSSI/canal a cada 5s, resultado da rajada de publish). Ver AGENTS.md.
[env:esp32_debug]
extends = env:esp32
build_flags =
  ${env:esp32.build_flags}
  -D MESH_DEBUG

; Mesmo firmware do [env:esp8266], com os prints extras de diagnostico.
[env:esp8266_debug]
extends = env:esp8266
build_flags =
  ${env:esp8266.build_flags}
  -D MESH_DEBUG
