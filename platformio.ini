[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

extra_scripts =
  pre:scripts/load_env.py

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager@^2.0.17
  https://github.com/jonatasperaza/painlessMesh-fixed.git

build_flags =
  -D MQTT_MAX_PACKET_SIZE=4096

; Placa ESP8266 (ex.: LOLIN/Wemos D1 mini). mesh_node_core.cpp ja trata as
; diferencas de plataforma (SHA-256 via BearSSL em vez de mbedtls, polaridade
; do LED onboard). painlessMesh-fixed suporta os dois chips nativamente.
[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
upload_speed = 921600

extra_scripts =
  pre:scripts/load_env.py

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager@^2.0.17
  https://github.com/jonatasperaza/painlessMesh-fixed.git

build_flags =
  -D MQTT_MAX_PACKET_SIZE=4096

; ESP32-S3 e ESP32-C3: mesmo firmware/libs do [env:esp32], so troca a placa.
; Ver AGENTS.md, secao "ESP32-S3 / ESP32-C3" (LED de status, Serial via USB
; nativa, OTA separado por chip).
[env:esp32s3]
extends = env:esp32
board = esp32-s3-devkitc-1
build_flags =
  ${env:esp32.build_flags}
  ; Placa so com a USB nativa do chip (sem conversor USB-serial): descomenta
  ; pra o Serial sair por ela.
  ; -D ARDUINO_USB_MODE=1
  ; -D ARDUINO_USB_CDC_ON_BOOT=1
  ; LED de status em outro pino / invertido (padrao: LED_BUILTIN da placa):
  ; -D STATUS_LED_PIN=48
  ; -D STATUS_LED_ACTIVE_LOW=1

[env:esp32c3]
extends = env:esp32
board = esp32-c3-devkitm-1
build_flags =
  ${env:esp32.build_flags}
  ; Placa so com a USB nativa do chip (ex.: C3 Super Mini): descomenta pra o
  ; Serial sair por ela.
  ; -D ARDUINO_USB_MODE=1
  ; -D ARDUINO_USB_CDC_ON_BOOT=1
  ; C3 Super Mini: LED azul no GPIO8, liga com LOW.
  ; -D STATUS_LED_PIN=8
  ; -D STATUS_LED_ACTIVE_LOW=1

; Mesmo firmware do [env:esp32], com prints extras de diagnostico (status
; WiFi/RSSI/canal a cada 5s, resultado da rajada de publish). Ver AGENTS.md.
[env:esp32_debug]
extends = env:esp32
build_flags =
  ${env:esp32.build_flags}
  -D MESH_DEBUG

; Mesmo firmware do [env:esp8266], com os prints extras de diagnostico.
[env:esp8266_debug]
extends = env:esp8266
build_flags =
  ${env:esp8266.build_flags}
  -D MESH_DEBUG

[env:esp32s3_debug]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -D MESH_DEBUG

[env:esp32c3_debug]
extends = env:esp32c3
build_flags =
  ${env:esp32c3.build_flags}
  -D MESH_DEBUG
