[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

extra_scripts =
  pre:scripts/load_env.py

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  ; TROQUE por uma URL git da lib corrigida quando publicar (ver AGENTS.md).
  file://C:/Users/User/Documents/LibFix/painlessMesh_gitlab

build_flags =
  -D MQTT_MAX_PACKET_SIZE=4096
